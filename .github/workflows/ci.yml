name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Unit tests only — pure functions, no API keys or network needed.
      # Integration tests (test-all-endpoints, test-402-production) require
      # secrets and a running server; they stay manual.
      - run: bun test test/unit.test.ts
      - run: bun test test/caller-id.test.ts
      # StonkFun product line — recorded fixtures only (live smoke needs STONK_LIVE=1).
      - run: bun test test/stonk.test.ts
      # /mcp method-gating guard — imports the app in-process, no network needed.
      # Protects the 2026-07-21 OOM fix (GET /mcp must stay 405).
      - run: bun test test/mcp-methods.test.ts
      # Settle-first middleware + cache warmer (A1, 2026-09-20) — fake resource
      # server, in-process Hono app, no network.
      - run: bun test test/settle-first.test.ts
      # /status verdict rules (A3, 2026-09-20) — pure function.
      - run: bun test test/status.test.ts
      # Copy-count guard (B1, 2026-09-20): "<N> endpoints/tools" on the landing,
      # docs page, and READMEs must equal the counts in code.
      - run: bun test test/copy-counts.test.ts
      # B2 (2026-09-20): API root negotiation, API robots.txt, llms-full.txt — pure modules.
      - run: bun test test/discovery-surfaces.test.ts
      # B3 (2026-09-20): suite map covers every endpoint once; llms.txt / llms-full.txt order.
      - run: bun test test/llms-order.test.ts
