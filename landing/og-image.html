<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #06060A;
      font-family: 'Space Grotesk', sans-serif;
      color: #E8E8F0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
      position: relative;
      overflow: hidden;
    }

    /* Gradient orbs */
    body::before {
      content: '';
      position: absolute;
      top: -100px; right: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,255,163,0.12) 0%, transparent 70%);
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -150px; left: -50px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(153,69,255,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* Grid lines */
    .grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(26,26,46,0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,26,46,0.4) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .content { position: relative; z-index: 1; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00FFA3;
      margin-bottom: 24px;
    }
    .dot {
      width: 8px; height: 8px;
      background: #00FFA3;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,255,163,0.6);
    }

    .logo {
      font-size: 52px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .logo span { color: #00FFA3; }

    .tagline {
      font-size: 26px;
      font-weight: 600;
      color: #8888A8;
      margin-bottom: 40px;
    }

    .stats {
      display: flex;
      gap: 48px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 700;
      color: #00FFA3;
    }
    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #555570;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #00FFA3, #9945FF, #14F195);
    }

    .features {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .feature {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #8888A8;
      background: #111119;
      border: 1px solid #1A1A2E;
      padding: 8px 16px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="status"><div class="dot"></div> Live on Mainnet</div>
    <div class="logo">SolEnrich<span>.agent</span></div>
    <div class="tagline">Onchain intelligence for agents & LLMs</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value">11</div>
        <div class="stat-label">Endpoints</div>
      </div>
      <div class="stat">
        <div class="stat-value">x402</div>
        <div class="stat-label">USDC Payments</div>
      </div>
      <div class="stat">
        <div class="stat-value">5</div>
        <div class="stat-label">Data Sources</div>
      </div>
      <div class="stat">
        <div class="stat-value">MCP</div>
        <div class="stat-label">Claude / Cursor</div>
      </div>
    </div>

    <div class="features">
      <div class="feature">Wallet Profiling</div>
      <div class="feature">Token Risk</div>
      <div class="feature">Whale Watch</div>
      <div class="feature">Due Diligence</div>
      <div class="feature">Copy-Trade Signals</div>
      <div class="feature">Wallet Graph</div>
    </div>
  </div>
  <div class="bottom-bar"></div>
</body>
</html>
